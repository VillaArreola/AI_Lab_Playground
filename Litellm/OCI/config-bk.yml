# =========================================================
# LITELLM SETTINGS (Comportamiento del Motor)
# =========================================================
litellm_settings:
  # Performance
  stream: true             # Streaming fluido
  drop_params: true        # Vital: Evita errores si mandas parametros de OpenAI a Ollama

  # Logging
  set_verbose: false       # Pon en 'true' si algo falla y quieres ver el error
  json_logs: false

  # Callbacks (Opcional, dejalo vacio por ahora)
  success_callback: []
  failure_callback: []

# =========================================================
# ROUTER SETTINGS (Logica de Fallbacks)
# =========================================================
router_settings:
  routing_strategy: "simple-shuffle"  # Balancea un poco la carga
  num_retries: 3                      # Si falla el 1, intenta el 2, luego el 3
  timeout: 300                        # Tiempo maximo total
  cooldown_time: 60                   # Si un modelo muere, no lo uses por 1 min
  retry_delay: 2                      # Espera 2s antes de reintentar

# =========================================================
# GENERAL SETTINGS (Seguridad y DB)
# =========================================================
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

  # Presupuesto de Seguridad
  max_budget: 100.0        # $100 USD al mes maximo
  budget_duration: "30d"

  # Caching (Redis)
  cache:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
    ttl: 3600
    supported_call_types: ["completion", "acompletion", "embedding"]

  # Cache especifico para embeddings (mas largo porque no cambian)
  embedding_cache_ttl: 7200           # 2 horas para embeddings